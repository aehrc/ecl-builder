# Publishes the package to npm when a release is created, using trusted
# publishing (OIDC) for authentication.
# See: https://docs.npmjs.com/generating-provenance-statements

name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci -w packages/ecl-builder
      - run: npm test -w packages/ecl-builder

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm ci -w packages/ecl-builder
      - run: npm publish --provenance --access public -w packages/ecl-builder
